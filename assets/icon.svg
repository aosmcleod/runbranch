<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"    stop-color="#5468AE"/>
      <stop offset="0.45" stop-color="#2B3559"/>
      <stop offset="1"    stop-color="#11141E"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.28" cy="0.14" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="play" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"   stop-color="#7BFFC8"/>
      <stop offset="0.5" stop-color="#33DE9A"/>
      <stop offset="1"   stop-color="#12A56F"/>
    </linearGradient>

    <linearGradient id="playEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- light entering from the top-left, the way the system icons are lit -->
    <rect width="1024" height="1024" fill="url(#sheen)"/>

    <!-- the glyph sits on its own pool of light rather than on a flat field -->
    <ellipse cx="620" cy="530" rx="210" ry="180" fill="#2BE59B" opacity="0.42" filter="url(#glow)"/>

    <!-- the worktree: a trunk that branches off to its own demo -->
    <g stroke="#C3CEEC" stroke-opacity="0.52" stroke-width="42" fill="none"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M312 356 L312 668"/>
      <path d="M312 512 L404 512"/>
    </g>
    <circle cx="312" cy="356" r="50" fill="#C3CEEC" fill-opacity="0.52"/>
    <circle cx="312" cy="668" r="50" fill="#C3CEEC" fill-opacity="0.52"/>

    <!-- the demo you launch off it -->
    <g>
      <path d="M498 372 L498 652 L760 512 Z" fill="#0B1220" opacity="0.35"
            filter="url(#soft)" transform="translate(0,18)"/>
      <path d="M498 372 L498 652 L760 512 Z" fill="url(#play)"
            stroke="url(#play)" stroke-width="64" stroke-linejoin="round"/>
      <path d="M498 372 L498 652 L760 512 Z" fill="url(#playEdge)"
            stroke="url(#playEdge)" stroke-width="64" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- glass rim: bright along the top edge, faint elsewhere -->
  <rect x="3" y="3" width="1018" height="1018" rx="228" ry="228"
        fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
