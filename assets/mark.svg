<!--
  Runbranch mark. Copyright (C) 2026 Alec McLeod, GPL-3.0.

  The master. Every raster asset is rendered from this file, so there is one
  source rather than a PNG and a vector drifting apart.

  Two things were corrected against the Figma export:

  - The top blue petal carries mix-blend-mode:lighten. Figma's SVG export
    dropped it, which left an opaque blue petal painted over the warm one and
    an overlap that read blue-violet instead of magenta. Established by
    rendering all eight blend modes and measuring each against the mark.
  - The viewBox is tightened to the artwork. The export padded it
    asymmetrically, so anything placing this file had to guess.

  Render it with WebKit, not NSImage: NSImage silently ignores
  mix-blend-mode, which puts the overlap back to blue-violet.
-->
