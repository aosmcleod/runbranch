<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Dock icons are near-black with a slight lift at the top, not a
         full-strength gradient. Matching that keeps it in the same family. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#2B3038"/>
      <stop offset="0.5" stop-color="#17191F"/>
      <stop offset="1"   stop-color="#0D0E12"/>
    </linearGradient>

    <linearGradient id="glyph" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0"   stop-color="#84FFC7"/>
      <stop offset="1"   stop-color="#1ED18C"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>

    <filter id="cast" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <clipPath id="mask">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mask)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- The glyph is optically centred, not geometrically: a right-pointing
         triangle's mass sits at its centroid, one third back from the apex. -->
    <path d="M382 296 L382 728 L772 512 Z" fill="#000000" opacity="0.45"
          filter="url(#cast)" transform="translate(0,22)"/>
    <path d="M382 296 L382 728 L772 512 Z" fill="url(#glyph)"
          stroke="url(#glyph)" stroke-width="86" stroke-linejoin="round"/>
  </g>

  <rect x="3" y="3" width="1018" height="1018" rx="228" ry="228"
        fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
