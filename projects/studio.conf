# Function Studio — the complex case, and the reason every other key in this
# format is optional. Three servers, shared Postgres, migrations, and a
# gitignored env file that a fresh worktree cannot get from git.
NAME="Function Studio"
REPO="~/Development/work/Studio"
DEFAULT_BRANCH="development"

INSTALL="pnpm install --frozen-lockfile"

# Gitignored, so a worktree starts without it and everything 401s or cannot
# reach Postgres. Copied on every run, not just on create.
COPY_FILES=".env.local"

# Pinned: compose names its project after the directory it runs in, so from a
# worktree it would build a SECOND stack with empty volumes and then collide
# on docker-compose.yml's fixed container_name.
COMPOSE_PROJECT="studio"
COMPOSE_SERVICES="postgres valkey"

MIGRATE="pnpm --filter @fs/db db:migrate"

# name:port:healthpath:command
# /live is the api's shallow liveness probe — static 200, no DB, no auth.
TARGETS="api:4000:/live:pnpm --filter @fs/api dev
web:3000:/:pnpm --filter @fs/web dev
admin:3002:/:pnpm --filter @fs/admin dev"

# web and admin are useless without the api, so it is never a choice.
ALWAYS="api"
PRESETS="web=web admin=admin both=web,admin"

# Sidebar glyph (SF Symbols name).
SYMBOL="building.2"

# Each branch gets its own database, created and migrated from scratch and
# dropped with the worktree. Two branches with divergent migrations no longer
# rewrite each other.
DB_URL_VARS="DATABASE_URL DATABASE_READ_URL"
