# fxui — the ordinary case: install, run one command, open a URL.
NAME="function-ui"
REPO="~/Development/work/function-ui"
DEFAULT_BRANCH="main"
INSTALL="npm ci"
TARGETS="docs:5173:/:npm run docs -- --port {port}"
# vite --open launches its own browser; a second one is just a duplicate tab.
OPENS_ITSELF=1

# Sidebar glyph (SF Symbols name).
SYMBOL="paintpalette"
