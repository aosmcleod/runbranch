# A project definition. Copy this, rename it, and edit — the file name (minus
# .conf) is how you refer to the project on the command line.
#
# Every key is documented in docs/config.md, and `runbranch.sh doctor` will
# tell you what a config is missing or getting wrong.

NAME="Example"                  # what the sidebar shows
REPO="~/code/example"           # your checkout. Never modified
DEFAULT_BRANCH="main"

# name:port:healthpath:command — one per line. The command may contain colons;
# only the first three are separators.
#
# {port} is substituted with the port actually used, which lets Runbranch move
# the run when something else already holds that port. Without it the shift can
# only be offered through PORT in the environment, which most dev servers
# honour and some ignore.
TARGETS="web:3000:/:npm run dev -- --port {port}"

# Only what you need beyond this:
#
# INSTALL="npm ci"              # skipped if the worktree already has deps
# COPY_FILES=".env.local"       # gitignored, so a fresh worktree lacks it
# COMPOSE_SERVICES="postgres"   # brought up and health-waited
# MIGRATE="npm run db:migrate"
# SEED="npm run db:seed"        # an empty app is not worth looking at
# RUNTIME="mise"                # honour the repo's pinned tool versions
# DB_URL_VARS="DATABASE_URL"    # a database per branch. Postgres only
# ALWAYS="api"                  # targets every preset needs
# PRESETS="web=web  full=web,worker"
# PROCFILE=1                    # derive targets from the repo's Procfile
# SYMBOL="shippingbox"          # SF Symbol for the sidebar
