name: release

# Attaches the Windows downloads to a GitHub release (spec F18). Publishing a
# release builds Runbranch-<version>-windows-x64-setup.exe and the zip the
# updater fetches from the tagged commit, and uploads both; the Mac disk
# image stays a local step. It also attaches the Claude Code plugin as
# Runbranch-<version>-claude-code-plugin.zip. See docs/VERSIONING.md.
#
# Run by hand to rebuild or backfill one release's downloads: pick the tag and
# which platforms. "windows" is the default because it is the only app this
# workflow can build.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to, e.g. v1.6.0
        required: true
        type: string
      platforms:
        description: Which downloads to attach
        required: true
        default: windows
        type: choice
        options:
          - windows
          - mac
          - both
          - claude-code

permissions:
  contents: write

# One upload per tag at a time. Two runs racing on --clobber would leave
# whichever finished last, which is harmless but not worth the confusion.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    if: github.event_name == 'release' || inputs.platforms == 'windows' || inputs.platforms == 'both'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # The tagged commit, not the default branch: the zip has to be the
      # release the tag names, not whatever landed after it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Before building, because a mismatch is the mistake this is here to
      # catch: a tag pushed before the version bump in make-app.sh would build
      # a zip named for the old version, which the updater would never find,
      # and attach it to the new release. Read the way make-app.ps1 reads it.
      - name: the tag matches the version in make-app.sh
        run: |
          $m = [regex]::Match((Get-Content -Raw make-app.sh), 'CFBundleShortVersionString</key>\s*<string>([^<]+)</string>')
          if (-not $m.Success) { Write-Error "could not read the version from make-app.sh"; exit 1 }
          $version = $m.Groups[1].Value
          if ($env:TAG -ne "v$version") {
            Write-Error "the tag is $env:TAG but make-app.sh at that commit declares $version. Bump make-app.sh, or tag v$version."
            exit 1
          }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "tag $env:TAG, version $version"

      # By hand, the release has to exist already: this attaches, it does not
      # publish. Said here rather than as a confusing gh error at the end.
      - name: the release exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "there is no release for $env:TAG; publish it first"; exit 1 }

      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The runner images have carried Inno Setup 6, but it is not promised;
      # installed if it is missing, so the installer never quietly drops out.
      - name: Inno Setup
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: build the Windows release
        run: ./windows/make-app.ps1 -Release

      # Checked by name, which is what the updater looks for, so a build that
      # quietly produced something else fails here rather than on every
      # Windows machine that checks for updates.
      # The installer is what people download; the zip is what the updater
      # fetches. Both, or neither.
      - name: upload the installer and the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "dist/windows/Runbranch-$env:VERSION-windows-x64-setup.exe", "dist/windows/Runbranch-$env:VERSION-windows-x64.zip"
          foreach ($f in $files) { if (-not (Test-Path $f)) { Write-Error "make-app.ps1 did not produce $f"; exit 1 } }
          gh release upload $env:TAG @files --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "attached $($files -join ', ') to $env:TAG"

  # The Claude Code plugin, as a download beside the apps. Most people install
  # it from the marketplace (this repository), which serves main; the zip is
  # the plugin exactly as tagged, for `claude --plugin-dir` or an offline copy.
  claude-code:
    if: github.event_name == 'release' || inputs.platforms == 'claude-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The plugin's version is the app's (tools/lint.sh checks it on every
      # push). Checked again at the tag, because an installed plugin updates
      # only when that number moves.
      - name: the tag, the app and the plugin agree on the version
        run: |
          version="$(sed -n 's/.*CFBundleShortVersionString<\/key> *<string>\([^<]*\)<.*/\1/p' make-app.sh)"
          plugin="$(jq -r .version claude-code/.claude-plugin/plugin.json)"
          listed="$(jq -r '.plugins[] | select(.name == "runbranch") | .version' .claude-plugin/marketplace.json)"
          if [ "$TAG" != "v$version" ] || [ "$plugin" != "$version" ] || [ "$listed" != "$version" ]; then
            echo "::error::tag $TAG, make-app.sh $version, plugin.json $plugin, marketplace.json $listed: all four must name one version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: the release exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null || { echo "::error::there is no release for $TAG; publish it first"; exit 1; }

      # The folder as committed: git archive leaves out what .gitignore keeps
      # out (the type declarations Claude Code writes beside the plugin).
      - name: package and attach the plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="Runbranch-$VERSION-claude-code-plugin.zip"
          git archive --format=zip --prefix=runbranch/ -o "$zip" HEAD:claude-code
          unzip -l "$zip"
          unzip -l "$zip" | grep -q 'runbranch/.claude-plugin/plugin.json' || { echo "::error::$zip has no plugin.json"; exit 1; }
          gh release upload "$TAG" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached $zip to $TAG"

  mac:
    # Not built here, on purpose. make-dmg.sh would accept a CI build: it
    # refuses only a development build, and an ad-hoc signature verifies. But
    # the image that ships is signed with the "Runbranch Local Signing"
    # identity, which lives in one Mac's keychain (tools/make-signing-identity.sh)
    # and is not something to export into repository secrets. A CI image would
    # be signed ad-hoc: a different signature from every release before it,
    # passing every check while not being the documented build. So this job
    # says how to do it and succeeds, rather than failing a run that did
    # everything it was asked that it can do.
    #
    # ubuntu-latest rather than macos-26, since nothing here needs a Mac.
    if: github.event_name == 'workflow_dispatch' && (inputs.platforms == 'mac' || inputs.platforms == 'both')
    runs-on: ubuntu-latest
    steps:
      - name: the Mac image is built locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null \
               | grep -qxF "Runbranch-$version.dmg"; then
            state="$TAG already has Runbranch-$version.dmg attached."
          else
            state="$TAG has no Mac download yet."
          fi
          msg="The Mac disk image is built on the Mac that holds the signing identity, not in CI. $state"
          echo "::notice title=Mac image not built in CI::$msg"
          {
            echo "## Mac"
            echo
            echo "$msg On that Mac, at the tagged commit:"
            echo
            echo '```'
            echo "git checkout $TAG"
            echo "./make-app.sh --release"
            echo "./make-dmg.sh"
            echo "gh release upload $TAG dist/Runbranch-$version.dmg --clobber"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
